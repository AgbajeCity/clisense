name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests (map, depCheck, error-logger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bunx tsc --noEmit
      - name: Run targeted unit tests
        run: |
          bunx vitest run \
            src/lib/depCheck.test.ts \
            src/lib/mapErrorLogger.test.ts \
            src/components/MapStatusBadge.test.tsx \
            src/test/home-page.test.tsx
      - name: Run full unit suite
        run: bunx vitest run

  e2e-smoke:
    name: Playwright map smoke
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: bunx playwright test
      - name: Upload trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
